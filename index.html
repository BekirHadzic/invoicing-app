<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Salty Invoices</title>
<meta name="description" content="Simple invoicing app by SaltIT.">
<meta name="theme-color" content="#141213">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  /* Colours and fonts from the Salt Media / SaltIT brand */
  :root {
    --ink: #141213;
    --panel: #262222;
    --line: #3A3434;
    --fg: #F3EFEA;
    --muted: #B4ACA5;
    --silver: #B8BCC4;
    --burgundy: #9F192A;
    --burgundy-hover: #B51F33;
    --rose: #E8606F;
    --font: Montserrat, "Segoe UI", Arial, sans-serif;
    --mono: "IBM Plex Mono", Consolas, monospace;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--ink);
    color: var(--fg);
    font: 16px/1.5 var(--font);
    -webkit-tap-highlight-color: transparent;
  }
  :focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }

  /* ---- Header ---- */
  .top {
    position: sticky;
    top: 0;
    z-index: 5;
    background: rgba(20, 18, 19, .94);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
  }
  .top-inner {
    max-width: 960px;
    margin: 0 auto;
    padding: 12px 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px 24px;
  }
  .wordmark {
    margin: 0;
    font-size: 19px;
    font-weight: 300;
    letter-spacing: .04em;
    white-space: nowrap;
    color: var(--silver);
  }
  .wordmark b { font-weight: 800; color: #fff; }

  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 96px; }
  h1 { margin: 0 0 20px; font-size: 24px; font-weight: 700; line-height: 1.2; }
  .eyebrow {
    margin: 0 0 4px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--muted);
  }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px;
  }

  /* ---- Form controls ---- */
  .row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; }
  .row + .row, .row + .lines, .lines + .row { margin-top: 18px; }
  input {
    font: 16px/1.3 var(--font);
    color: var(--fg);
    background: var(--ink);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 14px;
    min-width: 0;
    width: 100%;
  }
  input:focus { border-color: var(--rose); outline: none; }
  input::placeholder { color: #7d7570; }
  input[aria-invalid="true"] { border-color: var(--rose); }
  input[type="number"] { text-align: right; font-family: var(--mono); }
  .grow { flex: 1 1 260px; }
  .field {
    flex: 0 1 190px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--muted);
  }
  .field.grow { flex: 1 1 260px; }
  .hint { font-size: 12px; font-weight: 400; text-transform: none; letter-spacing: 0; }
  .btn {
    border: 0;
    border-radius: 999px;
    background: var(--burgundy);
    color: var(--fg);
    font: 700 14px/1 var(--font);
    letter-spacing: .1em;
    text-transform: uppercase;
    padding: 14px 28px;
    cursor: pointer;
    transition: background .15s;
  }
  .btn:hover { background: var(--burgundy-hover); }
  .btn.ghost { background: none; color: var(--muted); border: 1px solid var(--line); }
  .btn.ghost:hover { color: var(--fg); border-color: var(--muted); }
  .btn.small { padding: 11px 18px; font-size: 12px; }
  .icon-btn {
    display: inline-grid;
    place-items: center;
    width: 38px;
    height: 38px;
    border: 0;
    border-radius: 10px;
    background: none;
    color: var(--muted);
    cursor: pointer;
  }
  .icon-btn:hover { background: var(--line); color: var(--fg); }
  .icon-btn.danger:hover { color: var(--rose); }
  .icon-btn svg { width: 18px; height: 18px; }
  .error {
    margin: 18px 0 0;
    padding: 12px 16px;
    border: 1px solid var(--rose);
    border-radius: 10px;
    color: var(--rose);
    font-size: 14px;
  }
  .error ul { margin: 0; padding-left: 18px; }

  /* ---- Invoice lines in the form ---- */
  .line {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 96px 130px 140px 38px;
    gap: 8px;
    align-items: center;
    margin-bottom: 8px;
  }
  .line-head span {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--muted);
  }
  .line-head .num, .line .amount { text-align: right; }
  .line .amount { font: 500 15px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .form-total {
    display: flex;
    justify-content: flex-end;
    align-items: baseline;
    gap: 16px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .1em;
  }
  .form-total strong { font: 500 22px var(--mono); color: var(--fg); letter-spacing: 0; text-transform: none; }
  @media (max-width: 640px) {
    .line-head { display: none; }
    .line {
      grid-template-columns: 1fr 1fr 38px;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--line);
    }
    .line .desc, .line .amount { grid-column: 1 / -1; }
    .line .remove { grid-row: 2; grid-column: 3; }
  }

  /* ---- Tables (list and invoice) ---- */
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th {
    padding: 8px 10px;
    text-align: left;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .1em;
    color: var(--muted);
    border-bottom: 1px solid var(--line);
    white-space: nowrap;
  }
  td { padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
  tfoot td { border-bottom: 0; font-weight: 700; }
  tfoot .num { font-size: 20px; }
  tr.open-invoice { cursor: pointer; }
  tr.open-invoice:hover td { background: var(--panel); }
  .actions-cell { width: 1%; white-space: nowrap; text-align: right; }

  /* ---- Invoice view ---- */
  .detail-head {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 16px 32px;
    margin-bottom: 24px;
  }
  .detail-head h1 { margin-bottom: 6px; }
  .client { margin: 0; font-size: 18px; font-weight: 600; }
  .meta { display: flex; flex-wrap: wrap; gap: 16px 32px; margin: 0; }
  .meta dt {
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .12em;
    color: var(--muted);
  }
  .meta dd { margin: 2px 0 0; font: 500 16px var(--mono); }
  .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 24px; }

  /* ---- Invoice list ---- */
  .list-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 8px 24px; }
  .empty { padding: 48px 16px; text-align: center; color: var(--muted); }
  .empty p { margin: 0 0 18px; }
  .notice { margin: 0 0 20px; padding: 12px 16px; border-radius: 10px; background: var(--panel); border-left: 3px solid var(--rose); }
</style>
</head>
<body>

<header class="top">
  <div class="top-inner">
    <p class="wordmark">Salty <b>Invoices</b></p>
    <button class="btn small" id="new-invoice" type="button">+ New invoice</button>
  </div>
</header>

<main>
  <!-- Create an invoice -->
  <section id="form-view" hidden>
    <form id="invoice-form" class="panel" novalidate>
      <p class="eyebrow">New invoice</p>
      <h1 id="form-number"></h1>
      <div class="row">
        <label class="field grow">Client
          <input id="client" autocomplete="off" placeholder="Client name">
        </label>
        <label class="field">Invoice date
          <input id="date" type="date">
        </label>
      </div>

      <div class="lines">
        <div class="line line-head" aria-hidden="true">
          <span>Description</span><span class="num">Quantity</span><span class="num">Price</span><span class="num">Amount</span><span></span>
        </div>
        <div id="lines"></div>
        <button type="button" class="btn ghost small" id="add-line">+ Add line</button>
        <div class="form-total">Total <strong id="form-total"></strong></div>
      </div>

      <div id="form-error" class="error" role="alert" hidden></div>

      <div class="row">
        <button class="btn" type="submit">Save invoice</button>
        <button class="btn ghost" type="button" id="cancel">Cancel</button>
      </div>
    </form>
  </section>

  <!-- One invoice -->
  <section id="detail-view" hidden></section>
</main>

<script>
'use strict';

// All invoices, kept in memory for now.
// lastNumber only goes up, so an invoice number is never used twice.
const data = { lastNumber: 0, invoices: [] };

const $ = (selector) => document.querySelector(selector);

const ICON_REMOVE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

// ---- Small helpers ----

// Makes text safe to put inside HTML (a client called "<b>" stays text).
function esc(text) {
  return String(text).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function newId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

// Today's date as YYYY-MM-DD in local time (toISOString would use UTC and can be a day off).
function todayISO() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

// 2026-10-27 -> 27.10.2026
function formatDate(iso) {
  const [y, m, d] = iso.split('-');
  return d + '.' + m + '.' + y;
}

// 7 -> INV-0007
function invoiceNo(number) {
  return 'INV-' + String(number).padStart(4, '0');
}

// 1.5 -> 1,5
function formatQty(quantity) {
  return String(quantity).replace('.', ',');
}

// ---- Money ----
// Amounts are rounded to whole cents once, then added up as whole numbers,
// because 0.1 + 0.2 is not exactly 0.3 in JavaScript.

// Quantity x price in cents. The tiny extra stops 1.005 * 100 = 100.4999… from rounding down.
function lineCents(line) {
  return Math.round(line.quantity * line.price * 100 + 1e-7);
}

function invoiceCents(invoice) {
  return invoice.lines.reduce((sum, line) => sum + lineCents(line), 0);
}

function money(cents) {
  return (cents / 100).toFixed(2);
}

function show(view) {
  for (const id of ['form-view', 'detail-view']) $('#' + id).hidden = id !== view;
  window.scrollTo(0, 0);
}

// ---- Create an invoice ----

function addLineRow() {
  const row = document.createElement('div');
  row.className = 'line';
  row.innerHTML = `
    <input class="desc" placeholder="Description" aria-label="Description">
    <input class="qty" type="number" step="any" min="0" inputmode="decimal" placeholder="Qty" aria-label="Quantity" value="1">
    <input class="price" type="number" step="any" min="0" inputmode="decimal" placeholder="Price" aria-label="Price">
    <span class="amount"></span>
    <button type="button" class="icon-btn danger remove" aria-label="Remove line" title="Remove line">${ICON_REMOVE}</button>`;
  $('#lines').append(row);
  updateAmounts();
  return row;
}

// Recalculates each line's amount and the total while you type.
// Empty or unfinished numbers count as 0 here; saving checks them properly.
function updateAmounts() {
  let total = 0;
  for (const row of document.querySelectorAll('#lines .line')) {
    const cents = lineCents({
      quantity: Number(row.querySelector('.qty').value) || 0,
      price: Number(row.querySelector('.price').value) || 0,
    });
    row.querySelector('.amount').textContent = money(cents);
    total += cents;
  }
  $('#form-total').textContent = money(total);
}

function openForm() {
  $('#invoice-form').reset();
  $('#date').value = todayISO();
  $('#form-number').textContent = invoiceNo(data.lastNumber + 1);
  $('#lines').innerHTML = '';
  addLineRow();
  show('form-view');
  $('#client').focus();
}

// What's typed in the form right now.
function readForm() {
  return {
    client: $('#client').value.trim(),
    date: $('#date').value,
    lines: [...document.querySelectorAll('#lines .line')].map((row) => ({
      description: row.querySelector('.desc').value.trim(),
      quantity: row.querySelector('.qty').value,
      price: row.querySelector('.price').value,
    })),
  };
}

$('#new-invoice').addEventListener('click', openForm);
$('#cancel').addEventListener('click', openForm);
$('#add-line').addEventListener('click', () => addLineRow().querySelector('.desc').focus());

$('#lines').addEventListener('click', (e) => {
  const remove = e.target.closest('.remove');
  if (remove) {
    remove.closest('.line').remove();
    updateAmounts();
  }
});
$('#lines').addEventListener('input', updateAmounts);

$('#invoice-form').addEventListener('submit', (e) => {
  e.preventDefault();
  const form = readForm();

  data.lastNumber += 1;
  const invoice = {
    id: newId(),
    number: data.lastNumber,
    client: form.client,
    date: form.date,
    lines: form.lines.map((line) => ({
      description: line.description,
      quantity: Number(line.quantity),
      price: Number(line.price),
    })),
  };
  data.invoices.push(invoice);
  showInvoice(invoice.id);
});

// ---- One invoice ----

function showInvoice(id) {
  const invoice = data.invoices.find((inv) => inv.id === id);
  const rows = invoice.lines.map((line) => `
    <tr>
      <td>${esc(line.description)}</td>
      <td class="num">${formatQty(line.quantity)}</td>
      <td class="num">${money(lineCents({ quantity: 1, price: line.price }))}</td>
      <td class="num">${money(lineCents(line))}</td>
    </tr>`).join('');

  $('#detail-view').innerHTML = `
    <div class="panel">
      <div class="detail-head">
        <div>
          <p class="eyebrow">Invoice</p>
          <h1 id="detail-number">${invoiceNo(invoice.number)}</h1>
          <p class="client" id="detail-client">${esc(invoice.client)}</p>
        </div>
        <dl class="meta">
          <div><dt>Date</dt><dd>${formatDate(invoice.date)}</dd></div>
        </dl>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Description</th><th class="num">Quantity</th><th class="num">Price</th><th class="num">Amount</th></tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr><td colspan="3">Total</td><td class="num" id="detail-total">${money(invoiceCents(invoice))}</td></tr></tfoot>
        </table>
      </div>
    </div>`;
  show('detail-view');
}

openForm();
</script>
</body>
</html>
